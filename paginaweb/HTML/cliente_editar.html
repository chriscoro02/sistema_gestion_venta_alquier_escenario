<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/paginaweb/CSS/style_dashboar.css">
</head>

<body>
    <aside class="sidebar">
        <h4>Administrador</h4>
        <nav>
            <a href="#">Panel Principal</a>
            <a href="">Alquiler</a>
            <a href="">Venta</a>
            <a href="clientes.html" class="active">Clientes</a>
            <a href="">Orden Produccion</a>
            <a href="">Inventario de Estructura Modulares</a>
            <hr>
            <button id="btnLogout">Cerrar sesión</button>
        </nav>
    </aside>

    <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 id="tituloCliente" class="m-0">Editar Cliente</h3>
            <div class="d-flex gap-2">
                <span id="usuarioBox" class="userchip"></span>
                <a href="clientes.html" class="btn btn-outline-secondary">← Volver a Clientes</a>
            </div>
        </div>

        <form id="frmCliente" class="card shadow-sm">
            <input type="hidden" name="id_cliente">

            <div class="card-body row g-3">
                <div class="col-12">
                    <h5>Datos de la Empresa</h5>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Razón Social *</label>
                    <input required name="razon_social" class="form-control" maxlength="180">
                </div>
                <div class="col-md-6">
                    <label class="form-label">NIT *</label>
                    <input required name="nit" class="form-control" maxlength="30">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tipo de Cliente</label>
                    <input name="tipo_cliente" class="form-control" maxlength="40">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-select">
                        <option value="ACTIVO">Activo</option>
                        <option value="INACTIVO">Inactivo</option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <h5>Datos del Contacto</h5>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nombre del Contacto *</label>
                    <input required name="nombre" class="form-control" maxlength="100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellido del Contacto *</label>
                    <input required name="apellido" class="form-control" maxlength="100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">CI del Contacto *</label>
                    <input required name="ci" class="form-control" maxlength="30">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono del Contacto</label>
                    <input name="telefono" class="form-control" maxlength="50">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" name="fecha_nacimiento" class="form-control">
                </div>

                <div class="col-12 mt-4">
                    <div id="msg" class="alert d-none"></div>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </div>
        </form>
    </main>

    <script type="module" src="../JS/cliente_editar.js"></script>
</body>

</html>
