<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Pagos Pendientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/paginaweb/CSS/style_dashboar.css">
</head>
<body>
  <aside class="sidebar">
        <h4>Administrador</h4>
        <nav>
            <a href="dashboard.html">Panel Principal</a>
            <a href="alquiler.html" >Alquiler</a>
            <a href="venta.html">Venta</a>
            <a href="diseno_plano.html">Orden de estructura</a>
            <a href="clientes.html">Registro Clientes</a>
            <a href="inventario.html">Inventario de Estructuras</a>
            <a href="pagos.html"class="active">Gestión de Pagos</a>
            <hr>
            <button id="btnLogout">Cerrar sesión</button>
        </nav>
    </aside>

    <main class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="m-0">Pagos Pendientes y Vencidos</h3>
            <div class="d-flex gap-2">
                <span id="usuarioBox" class="userchip">Cargando…</span>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tipo</th>
                                <th>Cliente</th>
                                <th>Fecha</th>
                                <th>Total Original (Bs.)</th>
                                <th>Saldo Pendiente (Bs.)</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyPagos">
                            <tr><td colspan="8" class="text-center text-muted py-4">Cargando…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    
    <div class="modal fade" id="pagoModal" tabindex="-1" aria-labelledby="pagoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pagoModalLabel">Registrar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formPago">
                        <input type="hidden" id="pagoIdTransaccion" name="id_transaccion">
                        <p>Cliente: <strong id="pagoClienteNombre"></strong></p>
                        <p>Deuda Actual: <strong id="pagoDeudaSaldo"></strong></p>
                        <div class="mb-3">
                            <label for="pagoMonto" class="form-label">Monto a Pagar (Bs.) *</label>
                            <input type="number" class="form-control" id="pagoMonto" name="monto" step="0.01" min="0.01" required>
                        </div>
                        <div id="pagoMsg" class="alert d-none"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarPago" class="btn btn-primary">Confirmar Pago</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../JS/pagos.js"></script>
    </body>
</html>
