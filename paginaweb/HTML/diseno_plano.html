<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Diseño de Plano – SGIEME</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/paginaweb/CSS/style_dashboar.css">
  <style>
    .chip{background:#e2e8f0;color:#0f172a;padding:6px 10px;border-radius:999px}
    .form-mini .form-control,.form-mini .form-select{height:38px;padding:.35rem .5rem}
    .table thead th{white-space:nowrap}
    code{color:#d9480f}
  </style>
</head>
<body>
  <aside class="sidebar">
    <h4>Administrador</h4>
    <nav>
      <a href="dashboard.html">Panel Principal</a>
      <a href="alquiler.html">Alquiler</a>
      <a href="venta.html">Venta</a>
      <a href="#" class="active">Diseño Plano</a>
      <a href="orden_produccion.html">Orden Producción</a>
      <a href="inventario_estructuras.html">Inventario de Estructuras</a>
      <hr>
      <button id="btnLogout">Cerrar sesión</button>
    </nav>
  </aside>

  <main class="content">
    <div class="topbar">
      <h3 class="m-0">Planos técnicos</h3>
      <div id="usuarioBox" class="chip">Cargando…</div>
    </div>

    <!-- Filtros -->
    <div class="card mb-3">
      <div class="card-body form-mini">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Buscar (código / tipo / descripción)</label>
            <input id="filtroTexto" type="search" class="form-control" placeholder="Ej: STD-FER-001">
          </div>
          <div class="col-md-2">
            <label class="form-label">Estado</label>
            <select id="filtroEstado" class="form-select">
              <option value="">Todos</option>
              <option value="ACTIVO">ACTIVO</option>
              <option value="INACTIVO">INACTIVO</option>
            </select>
          </div>
          <div class="col-md-6 text-md-end">
            <button id="btnNuevo" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuevo plano</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="tblPlanos">
            <thead>
              <tr>
                <th>#</th>
                <th>Código</th>
                <th>Tipo</th>
                <th>Cap. peso</th>
                <th>Cap. personas</th>
                <th>Dimensión</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody><!-- filas dinámicas --></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Crear/Editar -->
<!-- Modal: Crear/Editar -->
<div class="modal fade" id="modalPlano" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nuevo plano</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="formPlano" class="form-mini">
          <input type="hidden" id="id_plano_tecnico">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Tipo de estructura</label>
              <select id="id_tipo_estructura" class="form-select" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Ingeniero responsable</label>
              <select id="id_ingeniero" class="form-select">
                <!-- se carga por JS -->
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">Código de plano</label>
              <input id="codigo_plano_tecnico" type="text" class="form-control" maxlength="60" required placeholder="Ej: STD-FER-001">
            </div>
            <div class="col-md-12">
              <label class="form-label">Descripción</label>
              <input id="descripcion" type="text" class="form-control" maxlength="300">
            </div>
            <div class="col-md-4">
              <label class="form-label">Capacidad de peso (kg)</label>
              <input id="capacidad_peso" type="number" step="0.01" min="0" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Capacidad de personas</label>
              <input id="capacidad_persona" type="number" step="1" min="0" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Dimensión</label>
              <input id="dimension" type="text" class="form-control" maxlength="120" placeholder="Ej: 8m x 6m x 5m">
            </div>
            <div class="col-md-12">
              <label class="form-label">Materiales</label>
              <input id="materiales" type="text" class="form-control" maxlength="200" placeholder="Aluminio, truss 30x30, etc.">
            </div>
            <div class="col-md-4">
              <label class="form-label">Estado</label>
              <select id="estado" class="form-select" required>
                <option value="ACTIVO">ACTIVO</option>
                <option value="INACTIVO">INACTIVO</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="btnGuardar" class="btn btn-primary">Guardar</button>
      </div>
    </div>
  </div>
</div>

  <script src="/paginaweb/JS/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script type="module" src="/paginaweb/JS/diseno_plano.js"></script>
</body>
</html>
